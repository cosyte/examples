name: Em-dash gate

# The brand rule (knowledgebase 06-brand/voice-and-tone.md) bans the em dash (U+2014) and the en dash
# (U+2013) across every Cosyte surface, and names commit messages explicitly. The `no-emdash` job
# scans every tracked file and its name and, on a pull request, `no-emdash-messages` scans the
# title, the body and the commit messages. The starters themselves are tested by `starters.yml`.
#
# THE GATE IS NOT IN THIS REPOSITORY. It is the one implementation every Cosyte repository runs, the
# `no-emdash` command of `@cosyte/script-utils`, run through npx at the exact version below, since
# this repository has no root package.json. Moving to a new version means changing SCRIPT_UTILS here
# and in `claude-card.yml` together. A path the scan should leave out would go in
# `scripts/check-no-emdash.exclude`; none does today.
#
# WHY A SEPARATE WORKFLOW, and not a job in `starters.yml`:
#
#   The deciding factor is the trigger. The messages job below needs the `edited` activity
#   type, which is not a default: without it, a title or body edited after the last push is
#   never re-checked, and since this repo squash-merges, the PR title and body ARE the commit
#   message that lands on main. Re-running every starter on both Node lines each time someone
#   fixes a typo in a PR description would be a large cost for no extra safety.
#
#   Both jobs live here rather than in two workflows: the file scan is a checkout, one small
#   download and one scan, so it costs little to re-run on `edited`, and one file is one thing
#   to read.
#
# TWO JOBS, AND ONLY ONE IS REQUIRED. The `ci-required-checks` ruleset requires `no-emdash`, the
# tracked-file job, by that name: rename it and every pull request waits on a context nothing
# emits. `no-emdash-messages` MUST NEVER BECOME A REQUIRED CHECK: a Dependabot body quotes upstream
# release notes, dashes included, and a required check would block the bump on text nobody here
# wrote. It still goes red on such a body, so edit the dash out before merging: a squash merge
# makes the body part of the commit on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

# No concurrency group. A push and a PR edit can arrive together (Dependabot does both), and a run
# a group cancels, even a queued one under `cancel-in-progress: false`, can count as a failed
# `no-emdash` and block the merge until someone re-runs it. Each run takes seconds, so every one
# finishes.

permissions:
  contents: read

env:
  SCRIPT_UTILS: "@cosyte/script-utils@0.1.4"

jobs:
  no-emdash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check tracked files and their names
        run: npx -y "$SCRIPT_UTILS" no-emdash

  no-emdash-messages:
    # Pull requests only: on a push to main the message is already written, and this job exists
    # to stop one landing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the step below reads the PR's commit range, and the default shallow
          # clone does not contain the base commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The rule names commit messages explicitly, and a squash merge composes its message
      # from the PR title, the PR body, and the branch commits, so all three are checked.
      - name: Check PR title, body, and commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Collect first, scan second, and set the shell options here rather than trust the
          # runner's default: piping the collection straight into the scanner would hide a
          # failed `git log` (a rewritten base commit, or a future edit that drops
          # fetch-depth) behind a clean title and body, and the gate would print OK over
          # commits it never read. The title and body arrive through env and are never
          # interpolated into the script, so a PR description cannot inject shell.
          set -euo pipefail
          {
            printf '%s\n' "$PR_TITLE"
            printf '%s\n' "$PR_BODY"
            git log --format=%B "$BASE_SHA..$HEAD_SHA"
          } > "$RUNNER_TEMP/pr-messages.txt"
          npx -y "$SCRIPT_UTILS" no-emdash --stdin "the PR title, body, or commit messages" \
            < "$RUNNER_TEMP/pr-messages.txt"
