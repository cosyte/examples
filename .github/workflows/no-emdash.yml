name: Em-dash gate

# The brand rule (founder directive 2026-07-24, knowledgebase 06-brand/voice-and-tone.md)
# bans U+2014 outright across every cosyte surface, and names commit messages explicitly.
# `dates` was clean when this landed (both tracked files, `LICENSE` and `README.md`, scanned
# free of it at `aa3f044`), so this gate exists purely to keep it that way. A green run on a
# clean tree proves nothing on its own, which is why the script it calls refuses to print OK
# from a scan that did not read everything.
#
# WHY THIS IS THE ONLY PULL-REQUEST GATE THIS REPO HAS TODAY:
#
#   `dates` has no package manifest, no lockfile and no source. The org reusable
#   `cosyte/.github/.github/workflows/ci.yml@main` runs a fixed ladder against all three and
#   would be RED ON ARRIVAL here, which is strictly worse than no gate: it would block the
#   very pull requests this repo needs in order to acquire a package at all. The deferred
#   reusables and the precondition each one waits on are written down in `.github/CI.md`;
#   read that before adding a caller.
#
# WHY A SEPARATE WORKFLOW, and not a job in a shared pipeline:
#
#   The reusable pipeline is not an option even once it applies. hl7's `ci` job calls the org
#   reusable, which runs a fixed ladder and no arbitrary repo script.
#
#   The deciding factor is the trigger. The PR-text half below needs the `edited` activity
#   type, which is not a default: without it, a title or body edited after the last push is
#   never re-checked, and since this repo squash-merges, the PR title and body ARE the commit
#   message that lands on main. Re-running a full build matrix every time someone fixes a typo
#   in a PR description would be a large cost for no extra safety. Same call hl7 made
#   (hl7's own `no-emdash.yml`), and website before it, for the same reason.
#
#   Both halves live here rather than being split across two workflows: the file scan is a
#   checkout and one grep, so it costs nothing to re-run on `edited`, and one file is one
#   thing to read.
#
# THE PR-TEXT HALF MUST NEVER BECOME A REQUIRED STATUS CHECK ON ITS OWN, and neither half is
# a required context today. This repo has no branch ruleset, deliberately: requiring a context
# whose workflow has never completed on `main` strands every pull request with nothing saying
# why. Adding the ruleset is separate, later work with its own precondition (see `.github/CI.md`).
#
# Run it locally with `bash scripts/check-no-emdash.sh`. There is no package-script alias
# because there is no package manifest yet, and this repo is not the place one gets added.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-emdash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the commit-message step below reads the PR's commit range,
          # and the default shallow clone does not contain the base commit.
          fetch-depth: 0

      - name: Check tracked files
        run: bash scripts/check-no-emdash.sh

      # The rule names commit messages explicitly, and a squash merge composes its message
      # from the PR title, the PR body, and the branch commits, so all three are checked.
      # Pull requests only: on a push to main the message is already written, and this gate
      # exists to stop it landing.
      - name: Check PR title, body, and commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Collect first, scan second, and set the shell options here rather than trust the
          # runner's default: piping the collection straight into the scanner would hide a
          # failed `git log` (a rewritten base commit, or a future edit that drops
          # fetch-depth) behind a clean title and body, and the gate would print OK over
          # commits it never read. The title and body arrive through env and are never
          # interpolated into the script, so a PR description cannot inject shell.
          set -euo pipefail
          {
            printf '%s\n' "$PR_TITLE"
            printf '%s\n' "$PR_BODY"
            git log --format=%B "$BASE_SHA..$HEAD_SHA"
          } > "$RUNNER_TEMP/pr-messages.txt"
          bash scripts/check-no-emdash.sh --stdin "the PR title, body, or commit messages" \
            < "$RUNNER_TEMP/pr-messages.txt"
