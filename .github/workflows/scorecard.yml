name: Scorecard

# OpenSSF Scorecard supply-chain analysis through the shared workflow, called the way the libraries
# call it, at the published reference every Cosyte repository uses. It runs on main only: publishing the
# results needs the default branch.

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Tuesday 03:37 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "37 3 * * 2"

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      contents: read # required to resolve the reusable workflow (else contents:none and a startup failure)
      security-events: write # upload the SARIF to the Security tab
      id-token: write # publish results to the OpenSSF API (for the badge)
    uses: cosyte/.github/.github/workflows/scorecard.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
