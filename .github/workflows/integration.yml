name: Integration

# The full integration suite: every starter's `npm run test:full`, on both Node lines the libraries
# support. A starter's tests under test/integration/ are tagged by file name: `*.fast.test.js` also run
# in `npm test`, so `starters.yml` runs the fast slice on every pull request and `All starters` is its
# check; `*.full.test.js` (seed sweeps, many processes) run only here. `test:full` also holds the
# integration helpers (test/integration/support.js) to 100% line, branch and function coverage.
#
# It runs nightly on main from the lockfiles, on a pull request that changes an integration test or
# this file, and on demand. A library's release workflow calls it (workflow_call) with `package` and
# `artifact`: the artifact, uploaded earlier in the calling run, holds the one .tgz that release would
# publish. Each starter whose lockfile carries that package then installs the tarball in place of the
# registry version (as a dependency and as an override, so a copy deeper in the tree is replaced too),
# checks that every copy in the tree is the tarball's version, and runs the full suite. A starter that
# does not use the package is skipped, and a package no starter uses fails the run.
# integration-self-test.yml proves the override with a marked tarball that is not on the registry.

on:
  schedule:
    # The nightly run on main, 06:41 UTC, after the starters' own nightly run.
    - cron: "41 6 * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/integration.yml"
      - "*/test/integration/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: >-
          The @cosyte package whose tarball replaces the registry version, for example @cosyte/hl7.
          Empty runs every starter from its lockfile.
        type: string
        required: false
        default: ""
      artifact:
        description: >-
          The name of an artifact uploaded earlier in the calling run that holds exactly one .tgz of
          that package. Required when package is set.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      starters: ${{ steps.list.outputs.starters }}
    steps:
      # Always cosyte/examples: when a library's release calls this workflow, github.repository is
      # the caller, and checking that out would test the library's folders, not the starters. Our
      # own runs test their commit; a caller gets the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cosyte/examples
          ref: ${{ github.repository == 'cosyte/examples' && github.sha || '' }}
          persist-credentials: false

      - name: List the starters to run
        id: list
        env:
          PACKAGE: ${{ inputs.package }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          git ls-files -- '*/package.json' | awk -F/ 'NF == 2 { print $1 }' | sort > "$RUNNER_TEMP/all.txt"
          if [ -z "$PACKAGE" ]; then
            cp "$RUNNER_TEMP/all.txt" "$RUNNER_TEMP/starters.txt"
          else
            if [ -z "$ARTIFACT" ]; then
              echo "::error::package is set but artifact is not: name the artifact that holds its tarball."
              exit 1
            fi
            : > "$RUNNER_TEMP/starters.txt"
            while read -r starter; do
              if jq -e --arg p "$PACKAGE" \
                'any(.packages | keys[]; endswith("node_modules/" + $p))' \
                "$starter/package-lock.json" > /dev/null; then
                echo "$starter" >> "$RUNNER_TEMP/starters.txt"
              fi
            done < "$RUNNER_TEMP/all.txt"
          fi
          if [ ! -s "$RUNNER_TEMP/starters.txt" ]; then
            echo "::error::No starter to run${PACKAGE:+: no lockfile carries $PACKAGE}."
            exit 1
          fi
          cat "$RUNNER_TEMP/starters.txt"
          echo "starters=$(jq -R . < "$RUNNER_TEMP/starters.txt" | jq -cs .)" >> "$GITHUB_OUTPUT"

  full:
    needs: discover
    name: ${{ matrix.starter }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        starter: ${{ fromJSON(needs.discover.outputs.starters) }}
        node: ["22", "24"]
    defaults:
      run:
        working-directory: ${{ matrix.starter }}
    steps:
      # Always cosyte/examples: when a library's release calls this workflow, github.repository is
      # the caller, and checking that out would test the library's folders, not the starters. Our
      # own runs test their commit; a caller gets the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cosyte/examples
          ref: ${{ github.repository == 'cosyte/examples' && github.sha || '' }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.starter }}/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Download the release tarball
        if: inputs.package != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/override

      - name: Install the release tarball in place of the registry version
        if: inputs.package != ''
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/override/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::The artifact must hold exactly one .tgz; it holds ${#tarballs[@]}."
            exit 1
          fi
          tarball="${tarballs[0]}"
          manifest="$(tar -xzOf "$tarball" package/package.json)"
          name="$(jq -r .name <<< "$manifest")"
          expected="$(jq -r .version <<< "$manifest")"
          if [ "$name" != "$PACKAGE" ]; then
            echo "::error::The tarball is $name, not $PACKAGE."
            exit 1
          fi

          # The same file: spec as the dependency (where the starter names the package) and as an
          # override, so npm puts the tarball everywhere in the tree, a library's own dependency included.
          spec="file:$tarball"
          jq --arg p "$PACKAGE" --arg s "$spec" '
            (if .dependencies[$p] then .dependencies[$p] = $s else . end)
            | (if .devDependencies[$p] then .devDependencies[$p] = $s else . end)
            | .overrides[$p] = $s' package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" package.json
          npm install --no-audit --no-fund

          # Every copy of the package in the tree is the tarball's version, resolved from the file.
          jq -r --arg p "$PACKAGE" '.packages | to_entries[]
            | select(.key | endswith("node_modules/" + $p))
            | "\(.key) \(.value.version) \(.value.resolved // "")"' package-lock.json > "$RUNNER_TEMP/copies.txt"
          cat "$RUNNER_TEMP/copies.txt"
          if [ ! -s "$RUNNER_TEMP/copies.txt" ]; then
            echo "::error::$PACKAGE is not in the installed tree."
            exit 1
          fi
          while read -r key version resolved; do
            if [ "$version" != "$expected" ] || [[ "$resolved" != file:* ]]; then
              echo "::error::$key is $version from ${resolved:-the registry}, not $expected from the tarball."
              exit 1
            fi
          done < "$RUNNER_TEMP/copies.txt"
          installed="$(jq -r .version "node_modules/$PACKAGE/package.json")"
          if [ "$installed" != "$expected" ]; then
            echo "::error::node_modules holds $PACKAGE $installed, not $expected."
            exit 1
          fi
          echo "$PACKAGE $expected installed from the tarball."

      - name: Run the full suite
        run: npm run test:full

  all:
    name: Integration (full)
    if: always()
    needs: [discover, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require discovery and every full-suite job to pass
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          echo "discover: $DISCOVER_RESULT, full: $FULL_RESULT"
          [ "$DISCOVER_RESULT" = "success" ] && [ "$FULL_RESULT" = "success" ]
