name: Starters

# Every starter is a folder at the repository root with its own package.json and package-lock.json.
# The discover job lists them from the tracked files, so a new starter is tested from the pull request
# that adds it, with no edit here. Each one installs from its lockfile and runs its own `npm test`,
# which runs the starter and asserts its key output, on both Node lines the libraries support.
#
# `All starters` is the single check that stands for the whole matrix: it fails unless discovery and
# every matrix job succeeded, so the set of required checks does not change as starters are added.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:53 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "53 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      starters: ${{ steps.list.outputs.starters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List the starters
        id: list
        run: |
          set -euo pipefail
          git ls-files -- '*/package.json' | awk -F/ 'NF == 2 { print $1 }' | sort > "$RUNNER_TEMP/starters.txt"
          if [ ! -s "$RUNNER_TEMP/starters.txt" ]; then
            echo "::error::No starter found (a top-level folder with a tracked package.json)."
            exit 1
          fi
          cat "$RUNNER_TEMP/starters.txt"
          echo "starters=$(jq -R . < "$RUNNER_TEMP/starters.txt" | jq -cs .)" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    name: ${{ matrix.starter }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        starter: ${{ fromJSON(needs.discover.outputs.starters) }}
        node: ["22", "24"]
    defaults:
      run:
        working-directory: ${{ matrix.starter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.starter }}/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Run the starter and assert its output
        run: npm test

  all-starters:
    name: All starters
    if: always()
    needs: [discover, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require discovery and every starter job to pass
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "discover: $DISCOVER_RESULT, test: $TEST_RESULT"
          [ "$DISCOVER_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ]
