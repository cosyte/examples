name: CodeQL

# Static analysis through the shared CodeQL workflow, called the way the libraries call it, at the
# published reference every Cosyte repository uses. Two languages: `javascript-typescript` for the
# starters, and `actions` for the workflows under .github/workflows/, which run with this
# repository's token.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 03:37 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "37 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write # upload the SARIF to the Security tab
      contents: read
      actions: read
    uses: cosyte/.github/.github/workflows/codeql.yml@workflows-2026-11-07-498c7c13c886
    with:
      languages: '["actions", "javascript-typescript"]'
